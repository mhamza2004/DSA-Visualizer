<!DOCTYPE html>
<html>
<head>
    <title>DSA Visualizer</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial;
        }

        h2 {
            margin-bottom: 5px;
        }

        .app {
            max-width: 900px;
            margin: 30px auto;
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        button {
            background: #2563eb;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        input {
            padding: 8px;
            border-radius: 6px;
            border: none;
            width: 180px;
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 300px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
        }

        .bar {
            width: 32px;
            margin: 0 4px;
            background: #38bdf8;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-size: 12px;
            color: #020617;
            transition: height 0.3s;
        }

        .status {
            margin-top: 12px;
            font-weight: bold;
            min-height: 20px;
        }

        .section-title {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="app">
    <h2>DSA Algorithm Visualizer</h2>
    <p style="color:#94a3b8;">Interactive visualization of core data structures created by MUHAMMAD HAMZA - 71267</p>

    <div class="section-title">Array Operations</div>

    <div class="controls">
        <button onclick="generateArray()">Generate Array</button>
        <button onclick="bubbleSort()">Bubble Sort</button>
    </div>

    <div class="controls">
        <input type="number" id="targetInput" placeholder="Enter search value">
        <button onclick="linearSearch()">Linear Search</button>
    </div>

    <div class="section-title">Stack Operations</div>

    <div class="controls">
        <button onclick="pushStack()">Push</button>
        <button onclick="popStack()">Pop</button>
    </div>

    <div id="container"></div>
    <div class="status" id="message"></div>
</div>

<script>
    let array = [];
    let stack = [];
    const container = document.getElementById("container");
    const message = document.getElementById("message");

    function generateArray() {
        container.innerHTML = "";
        array = [];
        message.innerText = "New array generated";

        for (let i = 0; i < 8; i++) {
            let value = Math.floor(Math.random() * 90) + 10;
            array.push(value);
            createBar(value);
        }
    }

    function createBar(value) {
        let bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = value * 2 + "px";
        bar.innerText = value;
        container.appendChild(bar);
    }

    async function bubbleSort() {
        let bars = document.getElementsByClassName("bar");
        message.innerText = "Bubble sort in progress...";

        for (let i = 0; i < array.length; i++) {
            for (let j = 0; j < array.length - i - 1; j++) {
                bars[j].style.background = "#facc15";
                bars[j + 1].style.background = "#facc15";
                await delay(300);

                if (array[j] > array[j + 1]) {
                    [array[j], array[j + 1]] = [array[j + 1], array[j]];
                    bars[j].style.height = array[j] * 2 + "px";
                    bars[j].innerText = array[j];
                    bars[j + 1].style.height = array[j + 1] * 2 + "px";
                    bars[j + 1].innerText = array[j + 1];
                }

                bars[j].style.background = "#38bdf8";
                bars[j + 1].style.background = "#38bdf8";
            }
        }

        message.innerText = "Array sorted successfully";
    }

    async function linearSearch() {
        if (array.length === 0) {
            message.innerText = "Generate array first";
            return;
        }

        let input = document.getElementById("targetInput").value;
        if (input === "") {
            message.innerText = "Enter a value to search";
            return;
        }

        let target = parseInt(input);
        let bars = document.getElementsByClassName("bar");

        message.innerText = "Searching for " + target;

        for (let i = 0; i < array.length; i++) {
            bars[i].style.background = "#fb7185";
            await delay(300);

            if (array[i] === target) {
                bars[i].style.background = "#22c55e";
                message.innerText = "Target found at index " + i;
                return;
            }

            bars[i].style.background = "#38bdf8";
        }

        message.innerText = "Target not found";
    }

    function pushStack() {
        let value = Math.floor(Math.random() * 90) + 10;
        stack.push(value);
        renderStack();
        message.innerText = "Pushed " + value + " to stack";
    }

    function popStack() {
        if (stack.length === 0) {
            message.innerText = "Stack is empty";
            return;
        }
        let removed = stack.pop();
        renderStack();
        message.innerText = "Popped " + removed + " from stack";
    }

    function renderStack() {
        container.innerHTML = "";
        stack.forEach(v => createBar(v));
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
</script>

</body>
</html>
